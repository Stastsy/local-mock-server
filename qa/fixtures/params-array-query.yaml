# REQ-020: an array-typed query parameter with the default form/explode style.
openapi: 3.0.3
info:
  title: Array query parameter
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: tags
          in: query
          required: false
          schema:
            type: array
            minItems: 1
            maxItems: 3
            items:
              type: string
              minLength: 2
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
