# REQ-046: a specification that documents application/problem+json for its own 404. The
# X-Mock-Source header must still say `specification`, even though the media type coincides with
# the one every mock error uses.
openapi: 3.0.3
info:
  title: Documented problem+json
  version: 1.0.0
paths:
  /resource:
    get:
      operationId: getResource
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '404':
          description: documented not found
          content:
            application/problem+json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: DOCUMENTED_NOT_FOUND
                message: The specification documents this one.
