# REQ-010: `components.parameters.Filter` declares `content` instead of `schema` -- token
# `parameterContent` -- and nothing under `paths` references it, so the document must load.
openapi: 3.0.3
info:
  title: Unreferenced parameter content
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                    minimum: 1
                  name:
                    type: string
                    minLength: 1
components:
  parameters:
    Filter:
      name: filter
      in: query
      required: false
      content:
        application/json:
          schema:
            type: object
