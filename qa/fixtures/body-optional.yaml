# REQ-022: an operation whose requestBody is not required, and one that declares none at all.
openapi: 3.0.3
info:
  title: Optional request bodies
  version: 1.0.0
paths:
  /optional:
    post:
      operationId: postOptional
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /no-body:
    post:
      operationId: postNoBody
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
