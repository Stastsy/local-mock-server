# REQ-010: `components.examples.Remote` carries `externalValue` instead of `value` -- token
# `externalValue` -- and nothing under `paths` references it, so the document must load.
openapi: 3.0.3
info:
  title: Unreferenced external value
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                    minimum: 1
                  name:
                    type: string
                    minLength: 1
components:
  examples:
    Remote:
      summary: fetched from elsewhere
      externalValue: https://example.com/pets.json
